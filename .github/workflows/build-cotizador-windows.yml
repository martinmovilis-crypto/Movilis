name: Build Cotizador (Windows .exe)

on:
  workflow_dispatch: {}
  push:
    branches: [claude/vehicle-rental-quotes-rdgv2h]
    paths:
      - "presupuestos-src/presupuestos/**"
      - ".github/workflows/build-cotizador-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: presupuestos-src/presupuestos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows portable (.exe)
        run: npm run dist:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cotizador-Renting-Corporativo-Windows
          path: presupuestos-src/presupuestos/release/*.exe
          if-no-files-found: error

      - name: Publish download (Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete cotizador-latest -y --cleanup-tag || echo "no previous release"
          gh release create cotizador-latest release/*.exe --title "Cotizador Renting Corporativo (portable)" --notes "Programa portable para Windows. No requiere instalacion: descargar y doble clic."
