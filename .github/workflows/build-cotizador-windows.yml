name: Build Cotizador (Windows .exe)

on:
  workflow_dispatch: {}
  push:
    branches: [claude/vehicle-rental-quotes-rdgv2h]
    paths:
      - "presupuestos-src/presupuestos/**"
      - ".github/workflows/build-cotizador-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: presupuestos-src/presupuestos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (.exe)
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Cotizador-Renting-Corporativo-Windows
          path: presupuestos-src/presupuestos/release/*.exe
          if-no-files-found: error
