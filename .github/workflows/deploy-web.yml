name: Deploy web (GitHub Pages)

on:
  workflow_dispatch: {}
  push:
    branches: [claude/vehicle-rental-quotes-rdgv2h]
    paths:
      - "presupuestos-src/presupuestos/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: presupuestos-src/presupuestos
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build
        working-directory: presupuestos-src/presupuestos
        run: npm run build

      - name: Publish to gh-pages branch
        working-directory: presupuestos-src/presupuestos/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy web"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
